            \ Schema 返回结果。\n\n请分析以下本轮互动，判断是否产生值得长期保存的重要新事件。\n\n【玩家输入】\n{{#sys.query#}}\n\n【林知夏本轮回复】\n {{#llm.text#}}\n\n请严格按照 SYSTEM\
            \ 规定的 JSON 格式输出。"
