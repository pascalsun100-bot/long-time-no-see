app:
  description: '《好久不见》是一款基于 Dify 与 OceanBase PowerContext 构建的现实校园 AI 恋爱互动游戏。


    玩家将在大学公共选修课的微信群中，意外发现失联三年的小学、初中同学林知夏，并由此开启一段重新认识彼此的故事。


    游戏支持自由对话、行动描述、动态剧情发展和人物关系变化。林知夏拥有独立的性格与生活目标，能够根据玩家的选择产生不同反应。


    通过 PowerContext 长期记忆系统，角色可以记住玩家的行为、共同经历和重要约定，让跨会话互动具有连续性。


    作品采用现代大学生活背景，以自然交流、人物成长和真实的人际关系为核心体验。'
